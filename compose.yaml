# File: compose.yaml
# This root manifest intentionally stays thin. Per ADR-006, each service owns its local compose
# definition and the top-level file only includes those modules and declares the shared mesh
# network used for intra-platform communication.

include:
  - path: ui-shells/compose.yaml
  - path: services/core/compose.yaml
  - path: services/platform/compose.yaml

services:
  traefik:
    image: traefik:v3.7.12
    container_name: traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.dashboard.address=:8090"
    ports:
      - "80:80"
      - "8090:8090"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`localhost`)"
      - "traefik.http.routers.dashboard.entrypoints=dashboard"
      - "traefik.http.routers.dashboard.service=api@internal"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./config/traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro"
      - "./config/traefik/dynamic:/etc/traefik/dynamic:ro"
    networks:
      - platform-mesh
      
  nats:
    image: nats:2.15-alpine
    container_name: nats
    ports:
      - "4222:4222" # Client connections
      - "8222:8222" # HTTP management & monitoring dashboard
    command: ["-c", "/etc/nats/nats.conf"]
    env_file:
      - .auth-keys/nats/broker.env
    volumes:
      - nats-data:/data
      - ./charts/nats/files/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - platform-mesh

  dbgate:
    image: dbgate/dbgate:7.2.6
    container_name: dbgate
    env_file:
      - .auth-keys/local/dbgate.env
    ports:
      - "3040:3000"
    environment:
      - CONNECTIONS=compliance,audit
      - LABEL_compliance=Compliance DB
      - SERVER_compliance=compliance-db
      - PORT_compliance=5432
      - DATABASE_compliance=compliance
      - ENGINE_compliance=postgres@dbgate-plugin-postgres
      - LABEL_audit=Audit Ledger DB
      - SERVER_audit=audit-db
      - PORT_audit=27017
      - DATABASE_audit=audit
      - ENGINE_audit=mongo@dbgate-plugin-mongo
    volumes:
      - dbgate-data:/root/.dbgate  # <-- Persists queries, history, and settings
    networks:
      - platform-mesh

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    env_file:
      - .auth-keys/local/minio.env
    ports:
      - "9000:9000"
      - "9001:9001" # console port. will have to forward in k3d to access: kubectl port-forward svc/minio 9001:9001
    command: server /data --console-address ":9001"
    networks:
      - platform-mesh
    volumes:
      - minio-data:/data

  minio-setup:
    image: dsap-minio-setup:local
    build:
      context: ./charts/minio
      dockerfile: Dockerfile.setup
    env_file:
      - .auth-keys/local/minio-setup.env
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: dsap
    depends_on:
      - minio
    networks:
      - platform-mesh
volumes:
  dbgate-data:
  minio-data:
  nats-data:

networks:
  platform-mesh:
    driver: bridge
    name: platform-mesh
    attachable: true
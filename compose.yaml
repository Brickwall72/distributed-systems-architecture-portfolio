# File: compose.yaml
# This root manifest intentionally stays thin. Per ADR-006, each service owns its local compose
# definition and the top-level file only includes those modules and declares the shared mesh
# network used for intra-platform communication.

include:
  - path: ui-shells/compose.yaml
  - path: services/core/compose.yaml
  - path: services/platform/compose.yaml

services:
  traefik:
    image: traefik:v3.7.12
    container_name: traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.dashboard.address=:8090"
    ports:
      - "80:80"
      - "8090:8090"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`localhost`)"
      - "traefik.http.routers.dashboard.entrypoints=dashboard"
      - "traefik.http.routers.dashboard.service=api@internal"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./config/traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro"
      - "./config/traefik/dynamic:/etc/traefik/dynamic:ro"
    networks:
      - platform-mesh

  dbgate:
    image: dbgate/dbgate:7.2.6
    container_name: dbgate
    ports:
      - "3040:3000"
    environment:
      - CONNECTIONS=compliance
      - LABEL_compliance=Compliance DB
      - SERVER_compliance=compliance-db
      - PORT_compliance=5432
      - USER_compliance=posty5432
      - PASSWORD_compliance=SecurePassword5432
      - ENGINE_compliance=postgres@dbgate-plugin-postgres
    volumes:
      - dbgate-data:/root/.dbgate  # <-- Persists queries, history, and settings
    networks:
      - platform-mesh

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001" # console port. will have to forward in k3d to access: kubectl port-forward svc/minio 9001:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    networks:
      - platform-mesh
    volumes:
      - minio-data:/data

  minio-setup:
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on:
      - minio
    networks:
      - platform-mesh
    entrypoint: >
      /bin/sh -c "
      until mc alias set localmfe http://minio:9000 minioadmin minioadmin; do echo 'Waiting for MinIO...'; sleep 1; done;
      mc mb --ignore-existing localmfe/compliance-documents;
      mc anonymous set public localmfe/compliance-documents;
      exit 0;
      "
volumes:
  dbgate-data:
  minio-data:

networks:
  platform-mesh:
    driver: bridge
    name: platform-mesh
    attachable: true
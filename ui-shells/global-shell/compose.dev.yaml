# File: ui-shells/global-shell/compose.dev.yaml
services:
  global-shell:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: global-shell:local
    container_name: global-shell
    ports:
      - "${PORT}:${PORT}"
    environment:
      VITE_RUNTIME: docker
      TOPOLOGY_REMOTE_ENTRY: http://localhost:3010/remoteEntry.js
      COMPLIANCE_REMOTE_ENTRY: http://localhost:3020/remoteEntry.js
      TOPOLOGY_API_URL: http://topology-server:8082
      PDF_API_URL: http://pdf-server:4001
    volumes:
      - .:/app/ui-shells/global-shell
    networks:
      - platform-mesh

networks:
  platform-mesh:
    name: platform-mesh

# File: ui-shells/global-shell/compose.dev.yaml
services:
  global-shell:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        VITE_ORIGIN: ${VITE_ORIGIN:-http://localhost:3000}
        TOPOLOGY_REMOTE_ENTRY: ${TOPOLOGY_REMOTE_ENTRY:-http://localhost:3010/topology/remoteEntry.js}
        COMPLIANCE_REMOTE_ENTRY: ${COMPLIANCE_REMOTE_ENTRY:-http://localhost:3020/compliance/remoteEntry.js}
    image: global-shell:local
    container_name: global-shell
    ports:
      - "${PORT}:${PORT}"
    environment:
      VITE_RUNTIME: docker
      VITE_ORIGIN: ${VITE_ORIGIN:-http://localhost:3000}
      TOPOLOGY_REMOTE_ENTRY: ${TOPOLOGY_REMOTE_ENTRY:-http://localhost:3010/topology/remoteEntry.js}
      COMPLIANCE_REMOTE_ENTRY: ${COMPLIANCE_REMOTE_ENTRY:-http://localhost:3020/compliance/remoteEntry.js}
      TOPOLOGY_API_URL: http://topology-server:8083
      PDF_API_URL: http://pdf-server:4001
      COMPLIANCE_API_URL: http://compliance-server:8082
    volumes:
      - .:/app/ui-shells/global-shell
    networks:
      - platform-mesh

networks:
  platform-mesh:
    name: platform-mesh

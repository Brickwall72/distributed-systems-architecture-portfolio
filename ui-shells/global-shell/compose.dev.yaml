# File: ui-shells/global-shell/compose.dev.yaml
services:
  global-shell:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: global-shell:local
    container_name: global-shell
    ports:
      - "${PORT}:${PORT}"
    environment:
      VITE_RUNTIME: docker
      VITE_REMOTE_ENTRY: http://localhost:3002/remoteEntry.js
      VITE_TOPOLOGY_API_URL: http://topology-server:8081
    volumes:
      - .:/app/ui-shells/global-shell
    networks:
      - platform-mesh

networks:
  platform-mesh:
    name: platform-mesh

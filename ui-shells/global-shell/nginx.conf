# File: ui-shells/global-shell/nginx.conf
server {
    listen 3000;
    server_name _;

    location = /health {
        access_log off;
        add_header 'Content-Type' 'text/plain';
        return 200 "healthy\n";
    }

    # Proxy requests preserving the path prefix expected by the sub-shell
    location /topology-shell/ {
        proxy_pass http://topology-shell:3000;
        proxy_set_header Host $host;
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    location /compliance-shell/ {
        proxy_pass http://compliance-shell:3000;
        proxy_set_header Host $host;
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    # Global Shell SPA routing
    location / {
        root /usr/share/nginx/html;
        index index.html;
        
        # --- REQUIRED FOR MODULE FEDERATION ---
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

        try_files $uri $uri/ /index.html;
    }
}
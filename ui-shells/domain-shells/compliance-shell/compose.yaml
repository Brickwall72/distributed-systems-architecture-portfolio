# File: ui-shells/domain-shells/compliance-shell/compose.yaml
services:
  compliance-shell:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    image: compliance-shell:prod
    container_name: compliance-shell
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.compliance-shell.rule=PathPrefix(`/compliance-shell`)"
      - "traefik.http.routers.compliance-shell.entrypoints=web"
      - "traefik.http.services.compliance-shell.loadbalancer.server.port=3000"
    depends_on:
      - pdf-client
      - esign-client
      - compliance-client
      - topology-client
    networks:
      - platform-mesh

networks:
  platform-mesh:
    name: platform-mesh
# File: services/platform/esign-service/compose.yaml
services:
  esign-server:
    build:
      context: .
      dockerfile: ./Dockerfile.server
      target: prod
    image: esign-server:prod
    container_name: esign-server
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.esign-api.rule=PathPrefix(`/esign/api`)"
      - "traefik.http.routers.esign-api.entrypoints=web"
      - "traefik.http.middlewares.esign-api-rewrite.replacepathregex.regex=^/esign/api/v1/(.*)"
      - "traefik.http.middlewares.esign-api-rewrite.replacepathregex.replacement=/api/v1/$1"
      - "traefik.http.routers.esign-api.middlewares=esign-api-rewrite"
      - "traefik.http.services.esign-api.loadbalancer.server.port=8080"
    environment:
      PORT: 8080
      NATS_URL: nats://nats:4222
      SIGNING_CERT_PATH: /app/certs/certificate.p12
      SIGNING_CERT_PASSWORD: ${SIGNING_CERT_PASSWORD}
    networks:
      - platform-mesh
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:8080/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - ./server/certs:/app/certs:ro

networks:
  platform-mesh:
    name: platform-mesh

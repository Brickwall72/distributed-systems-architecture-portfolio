# File: services/core/topology-service/compose.yaml
services:
  topology-db:
    image: neo4j:5.26.0
    container_name: topology-db
    environment:
      - NEO4J_AUTH=${DB_USER}/${DB_PASSWORD}
    ports:
      - "${DB_EXTERNAL_PORT}:7474"
      - "7687:7687"
    volumes:
      - topology_db_data:/data
    networks:
      - platform-mesh
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u \"${DB_USER}\" -p \"${DB_PASSWORD}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  topology-server:
    build:
      context: .
      dockerfile: Dockerfile.server
      target: prod
    image: topology-server:prod
    container_name: topology-server
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.topology-api.rule=PathPrefix(`/topology/api`)"
      - "traefik.http.routers.topology-api.entrypoints=web"
      - "traefik.http.middlewares.topology-api-rewrite.replacepathregex.regex=^/topology/api/v1/(.*)"
      - "traefik.http.middlewares.topology-api-rewrite.replacepathregex.replacement=/api/v1/$1"
      - "traefik.http.routers.topology-api.middlewares=topology-api-rewrite"
      - "traefik.http.services.topology-api.loadbalancer.server.port=8080"
    environment:
      DB_URI: bolt://topology-db:7687
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      topology-db:
        condition: service_healthy
    networks:
      - platform-mesh
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:8080/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  topology-client:
    build:
      context: .
      dockerfile: Dockerfile.client
      target: prod
    image: topology-client:prod
    container_name: topology-client
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.topology.rule=PathPrefix(`/topology`)"
      - "traefik.http.routers.topology.entrypoints=web"
      - "traefik.http.services.topology.loadbalancer.server.port=3000"
    depends_on:
      topology-server:
        condition: service_healthy
    networks:
      - platform-mesh

networks:
  platform-mesh:
    name: platform-mesh

volumes:
  topology_db_data:
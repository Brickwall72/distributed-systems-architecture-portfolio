# File: services/core/topology-service/compose.yaml
services:
  topology-db:
    image: neo4j:5.26.0
    container_name: topology-db
    environment:
      - NEO4J_AUTH=${DB_USER}/${DB_PASSWORD}
    ports:
      - "${DB_EXTERNAL_PORT}:7474"
      - "7687:7687"
    volumes:
      - topology_db_data:/data
    networks:
      - platform-mesh
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u \"${DB_USER}\" -p \"${DB_PASSWORD}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  topology-server:
    build:
      context: .
      dockerfile: Dockerfile.server
      target: prod
    image: topology-server:prod
    container_name: topology-server
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    environment:
      SERVER_PORT: ${SERVER_PORT}
      DB_URI: bolt://topology-db:7687
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      topology-db:
        condition: service_healthy
    networks:
      - platform-mesh
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:${SERVER_PORT:-8083}/api/v1/topology/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  topology-client:
    build:
      context: .
      dockerfile: Dockerfile.client
      target: prod
    image: topology-client:prod
    container_name: topology-client
    ports:
      - "${CLIENT_PORT}:${CLIENT_PORT}"
    environment:
      CLIENT_PORT: ${CLIENT_PORT}
    depends_on:
      topology-server:
        condition: service_healthy
    networks:
      - platform-mesh

networks:
  platform-mesh:
    name: platform-mesh

volumes:
  topology_db_data:
# File: services/core/compliance-service/compose.yaml
services:
  compliance-db:
    image: postgres:18.6-alpine
    container_name: compliance-db
    ports:
      - "${DB_PORT}:${DB_PORT}"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: compliance
      PGDATA: /var/lib/postgresql/data
    networks:
      - platform-mesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d compliance"]
      interval: 5s
      timeout: 5s
      retries: 5
  compliance-server:
    build:
      context: ./server
      dockerfile: ./Dockerfile
    image: compliance-server:local
    container_name: compliance-server
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.compliance-api.rule=PathPrefix(`/compliance/api`)"
      - "traefik.http.routers.compliance-api.entrypoints=web"
      - "traefik.http.middlewares.compliance-api-rewrite.replacepathregex.regex=^/compliance/api/v1/(.*)"
      - "traefik.http.middlewares.compliance-api-rewrite.replacepathregex.replacement=/api/v1/$1"
      - "traefik.http.routers.compliance-api.middlewares=compliance-api-rewrite"
      - "traefik.http.services.compliance-api.loadbalancer.server.port=8080"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT}
      POSTGRES_DB: compliance
    command: pnpm start
    volumes:
      - ./server:/app/services/core/compliance-service/server
    depends_on:
      compliance-db:
        condition: service_healthy
    networks:
      - platform-mesh
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:8080/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  compliance-client:
    build:
      context: ./client
      dockerfile: ./Dockerfile
    image: compliance-client:local
    container_name: compliance-client
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.compliance.rule=PathPrefix(`/compliance`)"
      - "traefik.http.routers.compliance.entrypoints=web"
      - "traefik.http.services.compliance.loadbalancer.server.port=3000"
    volumes:
      - ./client:/app/services/core/compliance-service/client
    depends_on:
      compliance-server:
        condition: service_healthy
    networks:
      - platform-mesh

networks:
  platform-mesh:
    name: platform-mesh

# File: services/core/compliance-service/compose.yaml
services:
  compliance-db:
    image: postgres:18.6-alpine
    container_name: compliance-db
    ports:
      - "${DB_PORT}:${DB_PORT}"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: compliance
      PGDATA: /var/lib/postgresql/data
    volumes:
      - compliance_db_data:/data
    networks:
      - platform-mesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d compliance"]
      interval: 5s
      timeout: 5s
      retries: 5
  compliance-server:
    build:
      context: .
      dockerfile: Dockerfile.server
      target: prod
    image: compliance-server:prod
    container_name: compliance-server
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    environment:
      SERVER_PORT: ${SERVER_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT}
      POSTGRES_DB: compliance
    depends_on:
      compliance-db:
        condition: service_healthy
    networks:
      - platform-mesh
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:${SERVER_PORT:-8083}/api/v1/compliance/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  compliance-client:
    build:
      context: .
      dockerfile: Dockerfile.client
      target: prod
    image: compliance-client:prod
    container_name: compliance-client
    ports:
      - "${CLIENT_PORT}:${CLIENT_PORT}"
    environment:
      PORT: ${CLIENT_PORT}
    depends_on:
      compliance-server:
        condition: service_healthy
    networks:
      - platform-mesh

networks:
  platform-mesh:
    name: platform-mesh

volumes:
  compliance_db_data:
# File: services/core/compliance-service/compose.yaml
services:
  compliance-db:
    image: postgres:18.6-alpine
    container_name: compliance-db
    ports:
      - "${DB_PORT}:${DB_PORT}"
    env_file:
      - ../../../.auth-keys/local/compliance-db.env
    command: ["postgres", "-c", "hba_file=/etc/dsap/pg_hba.conf"]
    environment:
      POSTGRES_DB: compliance
    volumes:
      # Postgres 18+ stores data in /var/lib/postgresql/18/docker; mount the parent
      - compliance_db_data:/var/lib/postgresql
      - ../../../charts/compliance-service/charts/database/files/pg_hba.conf:/etc/dsap/pg_hba.conf:ro
    networks:
      - platform-mesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d compliance"]
      interval: 5s
      timeout: 5s
      retries: 5
  compliance-db-setup:
    image: postgres:18.6-alpine
    env_file:
      - ../../../.auth-keys/local/compliance-db-setup.env
    environment:
      PGHOST: compliance-db
      PGPORT: "5432"
      PGDATABASE: compliance
    volumes:
      - ../../../charts/compliance-service/charts/database/files/provision.sh:/opt/dsap/provision.sh:ro
    entrypoint: ["sh", "/opt/dsap/provision.sh"]
    depends_on:
      compliance-db:
        condition: service_healthy
    networks:
      - platform-mesh
  compliance-server:
    build:
      context: .
      dockerfile: Dockerfile.server
      target: prod
    image: compliance-server:prod
    container_name: compliance-server
    env_file:
      - ../../../.auth-keys/nats/compliance.env
      - ../../../.auth-keys/local/compliance-server.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.compliance-api.rule=PathPrefix(`/compliance/api`)"
      - "traefik.http.routers.compliance-api.entrypoints=web"
      - "traefik.http.middlewares.compliance-api-rewrite.replacepathregex.regex=^/compliance/api/v1/(.*)"
      - "traefik.http.middlewares.compliance-api-rewrite.replacepathregex.replacement=/api/v1/$1"
      - "traefik.http.routers.compliance-api.middlewares=compliance-api-rewrite"
      - "traefik.http.services.compliance-api.loadbalancer.server.port=8080"
    environment:
      DB_PORT: ${DB_PORT}
      POSTGRES_DB: compliance
      NATS_URL: nats://nats:4222
      AUTH_PUBLIC_KEY_FILE: /run/secrets/auth_public_key
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: ${S3_REGION}
    secrets:
      - auth_public_key
    depends_on:
      compliance-db:
        condition: service_healthy
      compliance-db-setup:
        condition: service_completed_successfully
      minio-setup:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    networks:
      - platform-mesh
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:8080/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  compliance-client:
    build:
      context: .
      dockerfile: Dockerfile.client
      target: prod
    image: compliance-client:prod
    container_name: compliance-client
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.compliance.rule=PathPrefix(`/compliance`)"
      - "traefik.http.routers.compliance.entrypoints=web"
      - "traefik.http.services.compliance.loadbalancer.server.port=3000"
    depends_on:
      compliance-server:
        condition: service_healthy
    networks:
      - platform-mesh

secrets:
  auth_public_key:
    file: ../../../.auth-keys/public.pem

networks:
  platform-mesh:
    name: platform-mesh

volumes:
  compliance_db_data:
# File: services/core/compliance-service/compose.dev.yaml
services:
  audit-server:
    build:
      target: dev
    image: audit-server:dev
    environment:
      # Forces polling for cross-os volume event reliability
      - CHOKIDAR_USEPOLLING=true
    volumes:
      # Mount source for nodemon/Vite live-reloading
      - ./packages:/app/packages
      - ./services/core/audit-ledger/server:/app/services/core/audit-ledger/server
      # Prevent host node_modules from colliding with the container's unprivileged node user
      - /app/services/core/audit-ledger/server/node_modules

  audit-client:
    build:
      target: dev
    image: audit-client:dev
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./packages:/app/packages
      - ./services/core/audit-ledger/client:/app/services/core/audit-ledger/client
      - /app/services/core/audit-ledger/client/node_modules
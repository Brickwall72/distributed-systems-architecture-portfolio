# File: services/core/audit-ledger/compose.yaml
services:
  audit-db:
    image: mongo:9.0.4
    container_name: audit-db
    ports:
      - "${DB_PORT}:${DB_PORT}"
    env_file:
      - ../../../.auth-keys/local/audit-db.env
    volumes:
      - audit_db_data:/data/db
    networks:
      - platform-mesh
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  audit-db-setup:
    image: mongo:9.0.4
    env_file:
      - ../../../.auth-keys/local/audit-db-setup.env
    environment:
      AUDIT_DATABASE: audit
      AUDIT_MONGO_HOST: audit-db
      AUDIT_MONGO_PORT: "27017"
    volumes:
      - ../../../charts/audit-ledger/charts/database/files/provision.js:/opt/dsap/provision.js:ro
    entrypoint:
      - mongosh
      - --quiet
      - --host
      - audit-db
      - --eval
      - 'if (!db.getSiblingDB("admin").auth(process.env.MONGO_ADMIN_USER, process.env.MONGO_ADMIN_PASSWORD)) throw new Error("MongoDB administrator authentication failed"); load("/opt/dsap/provision.js")'
    depends_on:
      audit-db:
        condition: service_healthy
    networks:
      - platform-mesh
  audit-server:
    build:
      context: .
      dockerfile: Dockerfile.server
      target: prod
    image: audit-server:prod
    container_name: audit-server
    env_file:
      - ../../../.auth-keys/nats/audit.env
      - ../../../.auth-keys/local/audit-server.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.audit-api.rule=PathPrefix(`/audit/api`)"
      - "traefik.http.routers.audit-api.entrypoints=web"
      - "traefik.http.middlewares.audit-api-rewrite.replacepathregex.regex=^/audit/api/v1/(.*)"
      - "traefik.http.middlewares.audit-api-rewrite.replacepathregex.replacement=/api/v1/$1"
      - "traefik.http.routers.audit-api.middlewares=audit-api-rewrite"
      - "traefik.http.services.audit-api.loadbalancer.server.port=8080"
    environment:
      NATS_URL: nats://nats:4222
      DSAP_TRACING_ENABLED: ${DSAP_TRACING_ENABLED:-true}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      AUTH_PUBLIC_KEY_FILE: /run/secrets/auth_public_key
      DB_HOST: audit-db
      DB_PORT: ${DB_PORT}
      AUDIT_IMMUTABLE_INDEXES_PROVISIONED: "true"
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: ${S3_REGION}
    secrets:
      - auth_public_key
    depends_on:
      audit-db:
        condition: service_healthy
      audit-db-setup:
        condition: service_completed_successfully
      minio-setup:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    networks:
      - platform-mesh
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:8080/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  audit-client:
    build:
      context: .
      dockerfile: Dockerfile.client
      target: prod
    image: audit-client:prod
    container_name: audit-client
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.audit.rule=PathPrefix(`/audit`)"
      - "traefik.http.routers.audit.entrypoints=web"
      - "traefik.http.services.audit.loadbalancer.server.port=3000"
    depends_on:
      audit-server:
        condition: service_healthy
    networks:
      - platform-mesh

secrets:
  auth_public_key:
    file: ../../../.auth-keys/public.pem

networks:
  platform-mesh:
    name: platform-mesh

volumes:
  audit_db_data:
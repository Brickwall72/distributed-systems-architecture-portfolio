# File: charts/audit-ledger/charts/database/values.yaml
# Credentials come from the audit-db-credentials secret bootstrapped by
# scripts/k8s-local-secrets.sh (pnpm k8s:secrets) - not managed by this chart.

# The server chart sets DB_HOST to "audit-db", so the Service name must match literally.
nameOverride: audit-db

image:
  repository: mongo
  tag: 9.0.4
  pullPolicy: IfNotPresent

env:
  - name: MONGO_INITDB_ROOT_USERNAME
    valueFrom:
      secretKeyRef:
        name: audit-db-credentials
        key: DB_USER
  - name: MONGO_INITDB_ROOT_PASSWORD
    valueFrom:
      secretKeyRef:
        name: audit-db-credentials
        key: DB_PASSWORD

envFrom: []

annotations: {}

ports:
  - name: tcp
    port: 27017

probes:
  readiness:
    tcpSocket:
      port: 27017
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    tcpSocket:
      port: 27017
    initialDelaySeconds: 15
    periodSeconds: 20

persistence:
  enabled: true
  size: 1Gi
  mountPath: /data/db

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 1Gi

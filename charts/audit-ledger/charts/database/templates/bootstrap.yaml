# File: charts/audit-ledger/charts/database/templates/bootstrap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-db-bootstrap
data:
  provision.js: |-
{{ .Files.Get "files/provision.js" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: audit-db-setup-{{ printf "%s%s%s%s" (.Files.Get "files/provision.js") .Values.image.repository .Values.image.tag (toJson .Values.setupResources) | sha256sum | trunc 10 }}
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit-db-setup
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: provision
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.setupResources | nindent 12 }}
          command:
            - sh
            - -ec
            - |
              until mongosh --quiet --host audit-db --eval 'db.adminCommand({ping: 1})' >/dev/null 2>&1; do
                echo "Waiting for MongoDB."
                sleep 2
              done
              exec mongosh --quiet --host audit-db --eval 'if (!db.getSiblingDB("admin").auth(process.env.MONGO_ADMIN_USER, process.env.MONGO_ADMIN_PASSWORD)) throw new Error("MongoDB administrator authentication failed"); load("/opt/dsap/provision.js")'
          env:
            - name: AUDIT_DATABASE
              value: audit
            - name: AUDIT_MONGO_HOST
              value: audit-db
            - name: AUDIT_MONGO_PORT
              value: "27017"
            - name: MONGO_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: audit-db-admin-credentials
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: audit-db-admin-credentials
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: AUDIT_RUNTIME_USER
              valueFrom:
                secretKeyRef:
                  name: audit-db-credentials
                  key: DB_USER
            - name: AUDIT_RUNTIME_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: audit-db-credentials
                  key: DB_PASSWORD
          volumeMounts:
            - name: bootstrap
              mountPath: /opt/dsap
              readOnly: true
      volumes:
        - name: bootstrap
          configMap:
            name: audit-db-bootstrap

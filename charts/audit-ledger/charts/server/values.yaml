# File: charts/audit-ledger/charts/server/values.yaml

nameOverride: audit-server

image:
  repository: audit-server
  tag: prod
  pullPolicy: IfNotPresent

replicas: 1

minioReadiness:
  image: {repository: dsap-minio-setup, tag: latest, pullPolicy: IfNotPresent}
  credentialsSecret: minio-audit-credentials
  prefix: audit/transfers/
  resources:
    requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 64Mi}
    limits: {cpu: 500m, memory: 512Mi, ephemeral-storage: 256Mi}

# The ledger authenticates as the restricted application user.
env:
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: audit-db-credentials
        key: DB_USER
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: audit-db-credentials
        key: DB_PASSWORD
  - name: DB_HOST
    value: "audit-db"
  - name: DB_PORT
    value: "27017"
  - name: AUDIT_IMMUTABLE_INDEXES_PROVISIONED
    value: "true"
  - name: NATS_URL
    value: "nats://nats:4222"
  - name: AUTH_PUBLIC_KEY_FILE
    value: "/app/auth/public.pem"
  - name: S3_PUBLIC_ENDPOINT
    value: "http://minio.localhost:8081"
  - name: S3_REGION
    value: "us-east-1"
  - name: S3_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: minio-audit-credentials
        key: S3_ACCESS_KEY
  - name: S3_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: minio-audit-credentials
        key: S3_SECRET_KEY
envFrom:
  - secretRef:
      name: nats-audit-credentials

volumeMounts:
  - name: auth-public-key
    mountPath: "/app/auth"
    readOnly: true

volumes:
  - name: auth-public-key
    secret:
      secretName: auth-public-key
      items:
        - key: public.pem
          path: public.pem

initContainers:
  - name: wait-for-db
    image: mongo:9.0.4
    resources:
      requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 64Mi}
      limits: {cpu: 500m, memory: 512Mi, ephemeral-storage: 256Mi}
    command: ['sh', '-c', 'until mongosh --quiet --host audit-db --eval ''if (!db.getSiblingDB("admin").auth(process.env.DB_USER, process.env.DB_PASSWORD)) throw new Error("authentication failed")'' >/dev/null 2>&1; do echo waiting for provisioned database account; sleep 2; done']
    env:
      - name: DB_USER
        valueFrom:
          secretKeyRef:
            name: audit-db-credentials
            key: DB_USER
      - name: DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: audit-db-credentials
            key: DB_PASSWORD

annotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

probes:
  readiness:
    httpGet:
      path: /api/v1/health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    httpGet:
      path: /live
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# File: charts/nats/files/nats.conf
port: 4222
http: 8222
jetstream: { store_dir: "/data" }
authorization {
  users: [
    { user: compliance, password: $NATS_COMPLIANCE_PASSWORD, permissions: {
      publish: { allow: [
        "requests.topology.transfer.validate-draft", "requests.topology.transfer.reserve",
        "pdf.command.generate-draft", "esign.command.sign-document",
        "events.compliance.>", "$JS.API.STREAM.CREATE.COMPLIANCE_EVENTS",
        "$JS.API.INFO", "$JS.API.STREAM.INFO.COMPLIANCE_EVENTS", "$JS.API.STREAM.INFO.TOPOLOGY_EVENTS",
        "$JS.API.CONSUMER.CREATE.TOPOLOGY_EVENTS.compliance-service-transfer-event-created-consumer.events.topology.transfer.created",
        "$JS.API.CONSUMER.CREATE.TOPOLOGY_EVENTS.compliance-service-transfer-event-updated-consumer.events.topology.transfer.updated",
        "$JS.API.CONSUMER.CREATE.TOPOLOGY_EVENTS.compliance-service-transfer-event-completed-consumer.events.topology.transfer.completed",
        "$JS.API.CONSUMER.INFO.TOPOLOGY_EVENTS.compliance-service-transfer-event-created-consumer",
        "$JS.API.CONSUMER.INFO.TOPOLOGY_EVENTS.compliance-service-transfer-event-updated-consumer",
        "$JS.API.CONSUMER.INFO.TOPOLOGY_EVENTS.compliance-service-transfer-event-completed-consumer",
        "$JS.API.CONSUMER.MSG.NEXT.TOPOLOGY_EVENTS.compliance-service-transfer-event-created-consumer",
        "$JS.API.CONSUMER.MSG.NEXT.TOPOLOGY_EVENTS.compliance-service-transfer-event-updated-consumer",
        "$JS.API.CONSUMER.MSG.NEXT.TOPOLOGY_EVENTS.compliance-service-transfer-event-completed-consumer",
        "$JS.ACK.TOPOLOGY_EVENTS.compliance-service-transfer-event-created-consumer.>",
        "$JS.ACK.TOPOLOGY_EVENTS.compliance-service-transfer-event-updated-consumer.>",
        "$JS.ACK.TOPOLOGY_EVENTS.compliance-service-transfer-event-completed-consumer.>"
      ] }
      subscribe: { allow: ["_INBOX.compliance.>"] }
    } }
    { user: topology, password: $NATS_TOPOLOGY_PASSWORD, permissions: {
      publish: { allow: [
        "events.topology.>", "$JS.API.STREAM.CREATE.TOPOLOGY_EVENTS",
        "$JS.API.INFO", "$JS.API.STREAM.INFO.COMPLIANCE_EVENTS", "$JS.API.STREAM.INFO.TOPOLOGY_EVENTS",
        "$JS.API.CONSUMER.CREATE.COMPLIANCE_EVENTS.topology-service-signed-transfer-v1.events.compliance.transfer.signed",
        "$JS.API.CONSUMER.INFO.COMPLIANCE_EVENTS.topology-service-signed-transfer-v1",
        "$JS.API.CONSUMER.MSG.NEXT.COMPLIANCE_EVENTS.topology-service-signed-transfer-v1",
        "$JS.ACK.COMPLIANCE_EVENTS.topology-service-signed-transfer-v1.>"
      ], deny: ["events.compliance.>"] }
      subscribe: { allow: ["_INBOX.topology.>", "requests.topology.transfer.validate-draft", "requests.topology.transfer.reserve"] }
      allow_responses: true
    } }
    { user: audit, password: $NATS_AUDIT_PASSWORD, permissions: {
      publish: { allow: [
        "pdf.command.generate-draft",
        "$JS.API.INFO", "$JS.API.STREAM.INFO.COMPLIANCE_EVENTS", "$JS.API.STREAM.INFO.TOPOLOGY_EVENTS",
        "$JS.API.CONSUMER.CREATE.COMPLIANCE_EVENTS.audit-ledger-transfer-initiated-consumer.events.compliance.transfer.initiated",
        "$JS.API.CONSUMER.CREATE.COMPLIANCE_EVENTS.audit-ledger-transfer-received-consumer.events.compliance.transfer.received",
        "$JS.API.CONSUMER.CREATE.TOPOLOGY_EVENTS.audit-ledger-transfer-created-consumer.events.topology.transfer.created",
        "$JS.API.CONSUMER.CREATE.TOPOLOGY_EVENTS.audit-ledger-transfer-updated-consumer.events.topology.transfer.updated",
        "$JS.API.CONSUMER.CREATE.TOPOLOGY_EVENTS.audit-ledger-transfer-completed-consumer.events.topology.transfer.completed",
        "$JS.API.CONSUMER.INFO.COMPLIANCE_EVENTS.audit-ledger-transfer-initiated-consumer",
        "$JS.API.CONSUMER.INFO.COMPLIANCE_EVENTS.audit-ledger-transfer-received-consumer",
        "$JS.API.CONSUMER.INFO.TOPOLOGY_EVENTS.audit-ledger-transfer-created-consumer",
        "$JS.API.CONSUMER.INFO.TOPOLOGY_EVENTS.audit-ledger-transfer-updated-consumer",
        "$JS.API.CONSUMER.INFO.TOPOLOGY_EVENTS.audit-ledger-transfer-completed-consumer",
        "$JS.API.CONSUMER.MSG.NEXT.COMPLIANCE_EVENTS.audit-ledger-transfer-initiated-consumer",
        "$JS.API.CONSUMER.MSG.NEXT.COMPLIANCE_EVENTS.audit-ledger-transfer-received-consumer",
        "$JS.API.CONSUMER.MSG.NEXT.TOPOLOGY_EVENTS.audit-ledger-transfer-created-consumer",
        "$JS.API.CONSUMER.MSG.NEXT.TOPOLOGY_EVENTS.audit-ledger-transfer-updated-consumer",
        "$JS.API.CONSUMER.MSG.NEXT.TOPOLOGY_EVENTS.audit-ledger-transfer-completed-consumer",
        "$JS.ACK.COMPLIANCE_EVENTS.audit-ledger-transfer-initiated-consumer.>",
        "$JS.ACK.COMPLIANCE_EVENTS.audit-ledger-transfer-received-consumer.>",
        "$JS.ACK.TOPOLOGY_EVENTS.audit-ledger-transfer-created-consumer.>",
        "$JS.ACK.TOPOLOGY_EVENTS.audit-ledger-transfer-updated-consumer.>",
        "$JS.ACK.TOPOLOGY_EVENTS.audit-ledger-transfer-completed-consumer.>"
      ] }
      subscribe: { allow: ["_INBOX.audit.>"] }
    } }
    { user: esign, password: $NATS_ESIGN_PASSWORD, permissions: {
      publish: { allow: ["$JS.API.INFO"], deny: ["events.>"] }
      subscribe: { allow: ["_INBOX.esign.>", "esign.command.sign-document"] }
      allow_responses: true
    } }
    { user: pdf, password: $NATS_PDF_PASSWORD, permissions: {
      publish: { allow: ["$JS.API.INFO"], deny: ["events.>"] }
      subscribe: { allow: ["_INBOX.pdf.>", "pdf.command.generate-draft"] }
      allow_responses: true
    } }
  ]
}

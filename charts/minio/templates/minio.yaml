# File: charts/minio/templates/minio.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      serviceAccountName: minio
      automountServiceAccountToken: false
      securityContext:
        {{- include "platform-lib.databasePodSecurityContext" . | nindent 8 }}
      containers:
        - name: minio
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "platform-lib.containerSecurityContext" . | nindent 12 }}
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret | quote }}
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret | quote }}
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_API_CORS_ALLOW_ORIGIN
              value: {{ .Values.corsAllowOrigin | quote }}
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio-setup
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-setup-{{ printf "%s%s%s%s%s%s%s" (.Files.Get "files/provision.py") (.Files.Get "files/policies/compliance.json") (.Files.Get "files/policies/audit.json") (.Files.Get "files/policies/worker.json") .Values.setupImage.repository .Values.setupImage.tag (toJson .Values.setupResources) | sha256sum | trunc 10 }}
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-setup
    spec:
      restartPolicy: OnFailure
      serviceAccountName: minio-setup
      automountServiceAccountToken: false
      securityContext:
        {{- include "platform-lib.databasePodSecurityContext" . | nindent 8 }}
      containers:
        - name: mc
          image: "{{ .Values.setupImage.repository }}:{{ .Values.setupImage.tag }}"
          imagePullPolicy: {{ .Values.setupImage.pullPolicy }}
          securityContext:
            {{- include "platform-lib.containerSecurityContext" . | nindent 12 }}
          env:
            - name: MINIO_ENDPOINT
              value: http://minio:9000
            - name: MINIO_BUCKET
              value: {{ .Values.bucket | quote }}
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret | quote }}
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret | quote }}
                  key: MINIO_ROOT_PASSWORD
            {{- range $service := list "compliance" "audit" "esign" "pdf" }}
            - name: {{ upper $service }}_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-{{ $service }}-credentials
                  key: S3_ACCESS_KEY
            - name: {{ upper $service }}_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-{{ $service }}-credentials
                  key: S3_SECRET_KEY
            {{- end }}
          resources:
            {{- toYaml .Values.setupResources | nindent 12 }}
{{- if .Values.ingress.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minio-api
  namespace: {{ .Release.Namespace }} # Ensures it matches release namespace
spec:
  entryPoints:
    {{- toYaml .Values.ingress.entryPoints | nindent 4 }}
  routes:
    - match: {{ .Values.ingress.rule | quote }}
      kind: Rule
      services:
        - name: minio
          port: 9000
      middlewares:
        - name: gzip-compress
        - name: security-headers
{{- end }}
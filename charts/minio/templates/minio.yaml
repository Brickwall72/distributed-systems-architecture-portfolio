# File: charts/minio/templates/minio.yaml

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      serviceAccountName: minio
      automountServiceAccountToken: false
      securityContext:
        {{- include "platform-lib.databasePodSecurityContext" . | nindent 8 }}
      containers:
        - name: minio
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "platform-lib.containerSecurityContext" . | nindent 12 }}
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.rootUser | quote }}
            - name: MINIO_ROOT_PASSWORD
              value: {{ .Values.rootPassword | quote }}
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio-setup
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-setup
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-setup
    spec:
      restartPolicy: OnFailure
      serviceAccountName: minio-setup
      automountServiceAccountToken: false
      securityContext:
        {{- include "platform-lib.databasePodSecurityContext" . | nindent 8 }}
      containers:
        - name: mc
          image: "{{ .Values.setupImage.repository }}:{{ .Values.setupImage.tag }}"
          imagePullPolicy: {{ .Values.setupImage.pullPolicy }}
          securityContext:
            {{- include "platform-lib.containerSecurityContext" . | nindent 12 }}
          command:
            - /bin/sh
            - -c
            - |
              echo 'Waiting for MinIO to start...'
              until mc --config-dir /tmp alias set myminio http://minio:9000 {{ .Values.rootUser }} {{ .Values.rootPassword }}; do
                echo 'MinIO unavailable, retrying in 2 seconds...'
                sleep 2
              done
              echo 'MinIO is up. Creating buckets...'
              mc --config-dir /tmp mb myminio/{{ .Values.bucket }} --ignore-existing
              mc --config-dir /tmp anonymous set download myminio/{{ .Values.bucket }}
              echo 'MinIO setup complete.'
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
{{- if .Values.ingress.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minio-web
spec:
  entryPoints:
    {{- toYaml .Values.ingress.entryPoints | nindent 4 }}
  routes:
    - match: {{ .Values.ingress.rule | quote }}
      kind: Rule
      services:
        - name: minio
          port: 9001
      middlewares:
        - name: gzip-compress
        - name: security-headers
{{- end }}

# File: charts/minio/values.yaml

image:
  repository: cgr.dev/chainguard/minio
  tag: "latest"
  pullPolicy: IfNotPresent

setupImage:
  repository: cgr.dev/chainguard/minio-client
  tag: "latest-dev" # Required: -dev variant includes /bin/sh for the setup script
  pullPolicy: IfNotPresent

rootUser: minioadmin
rootPassword: minioadmin

bucket: compliance-documents

persistence:
  size: 5Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: true
  entryPoints:
    - web
  rule: "Host(`minio.localhost`)"
# File: charts/minio/values.yaml

image:
  repository: cgr.dev/chainguard/minio
  tag: "latest"
  pullPolicy: IfNotPresent

setupImage:
  repository: dsap-minio-setup
  tag: "latest"
  pullPolicy: IfNotPresent

credentialsSecret: minio-credentials

bucket: dsap

corsAllowOrigin: "*"

persistence:
  size: 5Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

setupResources:
  requests:
    cpu: 100m
    memory: 128Mi
    ephemeral-storage: 64Mi
  limits:
    cpu: 500m
    memory: 512Mi
    ephemeral-storage: 256Mi

ingress:
  enabled: false
  entryPoints:
    - web
  rule: "Host(`minio.localhost`)"
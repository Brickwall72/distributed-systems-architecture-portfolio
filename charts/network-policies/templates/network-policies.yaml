# File: charts/network-policies/templates/network-policies.yaml
# Ports here are containerPorts (8080 server, 3000 client/shell, 5432/7687 db, 9000 minio),
# not Service ports - k8s/local/network-policy.yaml used stale port numbers from an older
# scheme, corrected here to match platform-lib's actual containerPort convention.
#
# Selectors assume charts are installed with release name == chart name (e.g.
# all workload names are explicitly declared in their chart values. Database and
# shell components also use stable names independent of release name.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 3000
---

# File: charts/traefik-values.yaml
# Safe base values: only expose the web entry point; local development opts into
# its dashboard through traefik-values-local.yaml.

api:
  dashboard: false
  insecure: false

ports:
  web:
    exposedPort: 80
  dashboard:
    port: 8090
    expose:
      default: false
    exposedPort: 8090
    protocol: TCP

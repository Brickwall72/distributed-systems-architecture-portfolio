# File: charts/global-shell/charts/shell/values.yaml

nameOverride: global-shell

image:
  repository: global-shell
  tag: prod
  pullPolicy: IfNotPresent

replicas: 1

env: []
envFrom: []

annotations:
  prometheus.io/scrape: "false"

probes:
  readiness:
    httpGet:
      path: /health # <-- Change from / to /health
      port: 3000
    initialDelaySeconds: 3
    periodSeconds: 10
  liveness:
    httpGet:
      path: /health # <-- Change from / to /health
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 10

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 512Mi

volumeMounts:
  - name: registry-volume
    mountPath: /usr/share/nginx/html/registry
    readOnly: true

volumes:
  - name: registry-volume
    configMap:
      name: global-shell-registry
# File: charts/traefik-shared/templates/middlewares.yaml
# Mirrors config/traefik/dynamic/middlewares.yaml so compose and k8s apply the same chain.

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: gzip-compress
spec:
  compress: {}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
spec:
  headers:
    frameDeny: true
    contentTypeNosniff: true
    browserXssFilter: true
    referrerPolicy: "no-referrer"

# File: charts/compliance-service/charts/server/values.yaml

nameOverride: compliance-server

image:
  repository: compliance-server
  tag: dev
  pullPolicy: IfNotPresent

replicas: 1

env:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: compliance-db-credentials
        key: DATABASE_URL
envFrom: []

initContainers:
  - name: wait-for-db
    image: busybox
    command: ['sh', '-c', 'until nc -z compliance-db 5432; do echo waiting for db; sleep 2; done']

annotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

probes:
  readiness:
    httpGet:
      path: /api/v1/health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    httpGet:
      path: /api/v1/health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
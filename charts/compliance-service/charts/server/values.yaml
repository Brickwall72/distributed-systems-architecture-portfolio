# File: charts/compliance-service/charts/server/values.yaml

nameOverride: compliance-server

image:
  repository: compliance-server
  tag: prod
  pullPolicy: IfNotPresent

replicas: 1

minioReadiness:
  image: {repository: dsap-minio-setup, tag: latest, pullPolicy: IfNotPresent}
  credentialsSecret: minio-compliance-credentials
  prefix: compliance/drafts/
  resources:
    requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 64Mi}
    limits: {cpu: 500m, memory: 512Mi, ephemeral-storage: 256Mi}

env:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: compliance-db-credentials
        key: DATABASE_URL
  - name: NATS_URL
    value: "nats://nats:4222"
  - name: AUTH_PUBLIC_KEY_FILE
    value: "/app/auth/public.pem"
  - name: S3_PUBLIC_ENDPOINT
    value: "http://minio.localhost:8081"
  - name: S3_REGION
    value: "us-east-1"
  - name: S3_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: minio-compliance-credentials
        key: S3_ACCESS_KEY
  - name: S3_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: minio-compliance-credentials
        key: S3_SECRET_KEY
envFrom:
  - secretRef:
      name: nats-compliance-credentials

volumeMounts:
  - name: auth-public-key
    mountPath: "/app/auth"
    readOnly: true

volumes:
  - name: auth-public-key
    secret:
      secretName: auth-public-key
      items:
        - key: public.pem
          path: public.pem

initContainers:
  - name: wait-for-db
    image: postgres:18.6-alpine
    resources:
      requests: {cpu: 50m, memory: 64Mi, ephemeral-storage: 64Mi}
      limits: {cpu: 500m, memory: 256Mi, ephemeral-storage: 256Mi}
    command: ['sh', '-c', 'until psql -X --no-psqlrc --quiet -c "SELECT 1" >/dev/null 2>&1; do echo waiting for provisioned database account; sleep 2; done']
    env:
      - name: PGHOST
        value: compliance-db
      - name: PGDATABASE
        value: compliance
      - name: PGUSER
        valueFrom:
          secretKeyRef:
            name: compliance-db-credentials
            key: DB_USER
      - name: PGPASSWORD
        valueFrom:
          secretKeyRef:
            name: compliance-db-credentials
            key: DB_PASSWORD

annotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

probes:
  readiness:
    httpGet:
      path: /api/v1/health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    httpGet:
      path: /live
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
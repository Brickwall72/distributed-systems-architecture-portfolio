# File: charts/pdf-service/charts/server/values.yaml

nameOverride: pdf-server

image:
  repository: pdf-server
  tag: prod
  pullPolicy: IfNotPresent

replicas: 1

s3PublicEndpoint: "http://minio.localhost:8081"

minioReadiness:
  image: {repository: dsap-minio-setup, tag: latest, pullPolicy: IfNotPresent}
  credentialsSecret: minio-pdf-credentials
  prefix: compliance/drafts/
  resources:
    requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 64Mi}
    limits: {cpu: 500m, memory: 512Mi, ephemeral-storage: 256Mi}

env: 
  - name: S3_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: minio-pdf-credentials
        key: S3_ACCESS_KEY
  - name: S3_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: minio-pdf-credentials
        key: S3_SECRET_KEY
  - name: S3_ENDPOINT
    value: "http://minio:9000"
  - name: S3_PUBLIC_ENDPOINT
    value: '{{ .Values.s3PublicEndpoint }}'
  - name: S3_BUCKET
    value: "dsap"
  - name: NATS_URL
    value: "nats://nats:4222"
envFrom:
  - secretRef:
      name: nats-pdf-credentials

annotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

probes:
  readiness:
    httpGet:
      path: /api/v1/health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    httpGet:
      path: /api/v1/health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# File: charts/jaeger/templates/jaeger.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jaeger-traces
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- if ne .Values.storage.storageClassName nil }}
  storageClassName: {{ .Values.storage.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:{{ .Chart.AppVersion }}
          args: ["--config=/etc/jaeger/config.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml (mergeOverwrite (deepCopy .Values.resources) (dict "requests" (dict "ephemeral-storage" "1Gi") "limits" (dict "ephemeral-storage" "2Gi"))) | nindent 12 }}
          ports:
            - name: ui
              containerPort: 16686
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          startupProbe:
            httpGet:
              path: /status
              port: health
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /status
              port: health
          livenessProbe:
            httpGet:
              path: /status
              port: health
          volumeMounts:
            - name: config
              mountPath: /etc/jaeger
              readOnly: true
            - name: traces
              mountPath: /var/lib/jaeger
      volumes:
        - name: config
          configMap:
            name: jaeger-config
        - name: traces
          persistentVolumeClaim:
            claimName: jaeger-traces
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: ui
    - name: otlp-http
      port: 4318
      targetPort: otlp-http

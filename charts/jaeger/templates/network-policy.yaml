# File: charts/jaeger/templates/network-policy.yaml
{{- $servers := list "audit-server" "auth-server" "compliance-server" "esign-server" "pdf-server" "topology-server" -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jaeger-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: {{ $servers | toJson }}
      ports:
        - port: 4318
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jaeger-otlp-egress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: {{ $servers | toJson }}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jaeger
      ports:
        - port: 4318

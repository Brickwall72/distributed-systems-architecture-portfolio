# File: charts/esign-service/charts/server/values.yaml

nameOverride: esign-server

image:
  repository: esign-server
  tag: prod
  pullPolicy: IfNotPresent

replicas: 1

s3PublicEndpoint: "http://minio.localhost:8081"

minioReadiness:
  image: {repository: dsap-minio-setup, tag: latest, pullPolicy: IfNotPresent}
  credentialsSecret: minio-esign-credentials
  prefix: compliance/transfers/
  resources:
    requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 64Mi}
    limits: {cpu: 500m, memory: 512Mi, ephemeral-storage: 256Mi}

env: 
  - name: SIGNING_CERT_PATH
    value: "/app/certs/certificate.p12"
  - name: SIGNING_CERT_PASSWORD
    valueFrom:
      secretKeyRef:
        name: esign-secrets
        key: SIGNING_CERT_PASSWORD
  - name: S3_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: minio-esign-credentials
        key: S3_ACCESS_KEY
  - name: S3_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: minio-esign-credentials
        key: S3_SECRET_KEY
  - name: S3_ENDPOINT
    value: "http://minio:9000"
  - name: S3_PUBLIC_ENDPOINT
    value: '{{ .Values.s3PublicEndpoint }}'
  - name: S3_BUCKET
    value: "dsap"
  - name: NATS_URL
    value: "nats://nats:4222"
envFrom:
  - secretRef:
      name: nats-esign-credentials

# Volume configuration to mount PKCS#12 bundle from Secret
volumeMounts:
  - name: esign-cert-volume
    mountPath: "/app/certs"
    readOnly: true

volumes:
  - name: esign-cert-volume
    secret:
      secretName: esign-secrets
      items:
        - key: certificate.p12
          path: certificate.p12

annotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

probes:
  readiness:
    httpGet:
      path: /api/v1/health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    httpGet:
      path: /api/v1/health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
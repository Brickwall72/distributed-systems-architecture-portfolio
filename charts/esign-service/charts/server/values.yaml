# File: charts/esign-service/charts/server/values.yaml

nameOverride: esign-server

image:
  repository: esign-server
  tag: prod
  pullPolicy: IfNotPresent

replicas: 1

env: 
  - name: SIGNING_CERT_PATH
    value: "/app/certs/certificate.p12"
  - name: SIGNING_CERT_PASSWORD
    valueFrom:
      secretKeyRef:
        name: esign-secrets
        key: SIGNING_CERT_PASSWORD
  - name: S3_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: minio-credentials
        key: S3_ACCESS_KEY
  - name: S3_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: minio-credentials
        key: S3_SECRET_KEY
  - name: S3_ENDPOINT
    value: "http://minio.platform-local.svc.cluster.local:9000"
  - name: S3_BUCKET
    value: "dsap"
  - name: NATS_URL
    value: "nats://nats.platform-local.svc.cluster.local:4222"
envFrom: []

# Volume configuration to mount PKCS#12 bundle from Secret
volumeMounts:
  - name: esign-cert-volume
    mountPath: "/app/certs"
    readOnly: true

volumes:
  - name: esign-cert-volume
    secret:
      secretName: esign-secrets
      items:
        - key: certificate.p12
          path: certificate.p12

annotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

probes:
  readiness:
    httpGet:
      path: /api/v1/health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    httpGet:
      path: /api/v1/health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
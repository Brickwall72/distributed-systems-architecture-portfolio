packages:
  - 'services/**'
  - 'packages/**'
  - 'ui-shells/**'

overrides:
  zod: '^3.24.1'
  '@ts-rest/core': '^3.52.1'
  '@ts-rest/express': '^3.52.1'

peerDependencyRules:
  allowAny:
    - zod
    - '@ts-rest/core'

# Disable release age caching gates to ensure pristine multi-machine installations
minimumReleaseAge: 0

# Suppress non-TTY interactive prompts inside automated CI/CD and Docker environments
confirmModulesPurge: false

allowBuilds:
  '@scarf/scarf': false
  esbuild: true
  msw: true
  puppeteer: true

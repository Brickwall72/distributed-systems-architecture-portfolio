packages:
  - 'services/core/*'
  - 'services/platform/*'

# Enforces that local pnpm execution forces itself to match the package.json target version
manage-package-manager: true

# Security Supply-Chain Operations: Explicitly authorize native engine builds
onlyBuiltDependencies:
  - esbuild

# Disable release age caching gates to ensure pristine multi-machine installations
minimumReleaseAge: 0

# Suppress non-TTY interactive prompts inside automated CI/CD and Docker environments
confirmModulesPurge: false

allowBuilds:
  esbuild: true

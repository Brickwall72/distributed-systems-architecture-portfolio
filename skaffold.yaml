# File: skaffold.yaml
apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: distributed-platform
build:
  local:
    useBuildkit: true
  artifacts:
    - image: topology-server
      context: services/core/topology-service/server
      docker:
        dockerfile: Dockerfile
      sync:
        infer:
          - "**/*.ts"
          - "**/*.json"
    - image: topology-client
      context: services/core/topology-service/client
      docker:
        dockerfile: Dockerfile
      sync:
        infer:
          - "**/*.tsx"
          - "**/*.ts"
          - "**/*.json"
    - image: pdf-server
      context: services/platform/pdf-generator/server
      docker:
        dockerfile: Dockerfile
      sync:
        infer:
          - "**/*.ts"
          - "**/*.json"
    - image: pdf-client
      context: services/platform/pdf-generator/client
      docker:
        dockerfile: Dockerfile
      sync:
        infer:
          - "**/*.tsx"
          - "**/*.ts"
          - "**/*.json"
    - image: esign-server
      context: services/platform/esign-service/server
      docker:
        dockerfile: Dockerfile
      sync:
        infer:
          - "**/*.ts"
          - "**/*.json"
    - image: esign-client
      context: services/platform/esign-service/client
      docker:
        dockerfile: Dockerfile
      sync:
        infer:
          - "**/*.tsx"
          - "**/*.ts"
          - "**/*.json"
    - image: topology-shell
      context: ui-shells/domain-shells/topology-shell
      docker:
        dockerfile: Dockerfile
        buildArgs:
          VITE_ORIGIN: "http://localhost:8081"
      sync:
        infer:
          - "**/*.tsx"
          - "**/*.ts"
          - "**/*.json"
    - image: compliance-server
      context: services/core/compliance-service/server
      docker:
        dockerfile: Dockerfile
      sync:
        infer:
          - "**/*.ts"
          - "**/*.json"
    - image: compliance-client
      context: services/core/compliance-service/client
      docker:
        dockerfile: Dockerfile
      sync:
        infer:
          - "**/*.tsx"
          - "**/*.ts"
          - "**/*.json"
    - image: compliance-shell
      context: ui-shells/domain-shells/compliance-shell
      docker:
        dockerfile: Dockerfile
        buildArgs:
          VITE_ORIGIN: "http://localhost:8081"
      sync:
        infer:
          - "**/*.tsx"
          - "**/*.ts"
          - "**/*.json"
    - image: global-shell
      context: ui-shells/global-shell
      docker:
        dockerfile: Dockerfile
        buildArgs:
          VITE_ORIGIN: "http://localhost:8081"
      sync:
        infer:
          - "**/*.tsx"
          - "**/*.ts"
          - "**/*.json"
deploy:
  helm:
    releases:
      - name: network-policies
        chartPath: charts/network-policies
        namespace: platform-local
      - name: dbgate
        chartPath: charts/dbgate
        namespace: platform-local
      - name: minio
        chartPath: charts/minio
        namespace: platform-local
      - name: topology-service
        chartPath: charts/topology-service
        namespace: platform-local
        setValueTemplates:
          server.image.repository: "{{.IMAGE_REPO_topology_server}}"
          server.image.tag: "{{.IMAGE_TAG_topology_server}}"
          client.image.repository: "{{.IMAGE_REPO_topology_client}}"
          client.image.tag: "{{.IMAGE_TAG_topology_client}}"
      - name: compliance-service
        chartPath: charts/compliance-service
        namespace: platform-local
        setValueTemplates:
          server.image.repository: "{{.IMAGE_REPO_compliance_server}}"
          server.image.tag: "{{.IMAGE_TAG_compliance_server}}"
          client.image.repository: "{{.IMAGE_REPO_compliance_client}}"
          client.image.tag: "{{.IMAGE_TAG_compliance_client}}"
      - name: pdf-service
        chartPath: charts/pdf-service
        namespace: platform-local
        setValueTemplates:
          server.image.repository: "{{.IMAGE_REPO_pdf_server}}"
          server.image.tag: "{{.IMAGE_TAG_pdf_server}}"
          client.image.repository: "{{.IMAGE_REPO_pdf_client}}"
          client.image.tag: "{{.IMAGE_TAG_pdf_client}}"
      - name: esign-service
        chartPath: charts/esign-service
        namespace: platform-local
        setValueTemplates:
          server.image.repository: "{{.IMAGE_REPO_esign_server}}"
          server.image.tag: "{{.IMAGE_TAG_esign_server}}"
          client.image.repository: "{{.IMAGE_REPO_esign_client}}"
          client.image.tag: "{{.IMAGE_TAG_esign_client}}"
      - name: topology-shell
        chartPath: charts/topology-shell
        namespace: platform-local
        setValueTemplates:
          shell.image.repository: "{{.IMAGE_REPO_topology_shell}}"
          shell.image.tag: "{{.IMAGE_TAG_topology_shell}}"
      - name: compliance-shell
        chartPath: charts/compliance-shell
        namespace: platform-local
        setValueTemplates:
          shell.image.repository: "{{.IMAGE_REPO_compliance_shell}}"
          shell.image.tag: "{{.IMAGE_TAG_compliance_shell}}"
      - name: global-shell
        chartPath: charts/global-shell
        namespace: platform-local
        setValueTemplates:
          shell.image.repository: "{{.IMAGE_REPO_global_shell}}"
          shell.image.tag: "{{.IMAGE_TAG_global_shell}}"

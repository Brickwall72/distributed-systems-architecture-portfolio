# File: .github/workflows/ci.yaml
name: Continuous Integration Quality Gate

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# CENTRALIZED CONFIGURATION: Single source of truth for tool versions
env:
  NODE_TARGET_VERSION: 'node@26.7.0'
  PNPM_TARGET_VERSION: '11.24.0'

permissions:
  contents: read
  pull-requests: read # REQUIRED by paths-filter for PR evaluation

jobs:
  verify-and-test:
    name: Execute Workspace Unit Verification Matrix
    runs-on: ubuntu-latest

    steps:
      # Pinned to official v7.0.1 release commit (with history for diffing)
      - name: Harden Runner Security Boundaries (Checkout Repository)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2 # Ensures push events have enough commit history to compare against

      # Detect if pdf-generator server source code changed
      - name: Evaluate Workspace Changeset Boundaries
        id: changes
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
        with:
          filters: |
            pdf-server:
              - 'services/platform/pdf-generator/server/**'

      # Pinned to official pnpm/setup v2.0.2 release commit
      - name: Initialize Unified Package Manager and Node Runtime
        uses: pnpm/setup@bf5bfae7d43e2b2b1191383f5005cd3fb69b848d
        with:
          version: ${{ env.PNPM_TARGET_VERSION }}
          runtime: ${{ env.NODE_TARGET_VERSION }}
          install: false

      - name: Authorize Scoped Compiler Core Binaries
        run: pnpm approve-builds esbuild

      - name: Mount Cache-Optimized Supply Chain (Verify Dependencies)
        run: pnpm install --frozen-lockfile --ignore-scripts

      # ONLY install system Chromium if the pdf-generator server directory changed
      - name: Install System Chromium
        if: steps.changes.outputs.pdf-server == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Compile Workspace Packages
        run: pnpm build

      # Dynamically run tests for services that have had changes.
      - name: Execute Dynamic Workspace Contract & Test Matrix
        run: |
          # Determine the git comparison range (handles PR base branch or standard pushes)
          GIT_RANGE="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          
          # Automatically traverse two levels deep under services/ (e.g., services/core/topology-service)
          for service_dir in services/*/*/; do
            # Ensure both client and server subdirectories exist with package.json files
            [ -d "${service_dir}client" ] && [ -d "${service_dir}server" ] || continue
            
            service_name=$(basename "$service_dir")
            
            # Check for independent changes in client or server paths
            client_changed=false
            server_changed=false
            
            if ! git diff --quiet "$GIT_RANGE" -- "${service_dir}client"; then
              client_changed=true
            fi
            
            if ! git diff --quiet "$GIT_RANGE" -- "${service_dir}server"; then
              server_changed=true
            fi
            
            # If either side changed, execute the pipeline for this service
            if [ "$client_changed" = "true" ] || [ "$server_changed" = "true" ]; then
              echo "------------------------------------------------------------------"
              echo "⚡ Changes detected in ${service_name} (Client: ${client_changed} | Server: ${server_changed})"
              echo "------------------------------------------------------------------"
              
              # 1. Run Client Suites (Generates Pact JSON artifacts if contract tests exist)
              if [ -f "${service_dir}client/package.json" ]; then
                echo "▶ Running client test suites for ${service_name}..."
                pnpm --filter "./${service_dir}client" run test
              fi
              
              # 2. Run Server Suites (Consumes Pact JSON artifacts for verification)
              if [ -f "${service_dir}server/package.json" ]; then
                echo "▶ Running server test suites for ${service_name}..."
                pnpm --filter "./${service_dir}server" run test
              fi
            else
              echo "💤 ${service_name} unchanged. Skipping..."
            fi
          done
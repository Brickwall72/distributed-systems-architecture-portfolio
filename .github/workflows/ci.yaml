# File: .github/workflows/ci.yaml
name: Continuous Integration Quality Gate

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  NODE_TARGET_VERSION: 'node@26.7.0'
  PNPM_TARGET_VERSION: '11.24.0'
  SKAFFOLD_VERSION: 'v2.25.0'
  TRIVY_VERSION: '0.76.1'
  SUNSHINE_REVISION: 'beaab3faf2bab234069a8677fc627de2f0f01a3d'

permissions:
  contents: read

jobs:
  verify-and-test:
    name: Execute Workspace Verification and Test Pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # REQUIRED by paths-filter for PR evaluation

    steps:
      - name: Harden Runner Security Boundaries (Checkout Repository)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0 # Full git history allows Turbo and Pact to evaluate change boundaries reliably

      - name: Evaluate System Tooling Boundaries
        id: changes
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.2
        with:
          filters: |
            pdf-server:
              - 'services/platform/pdf-generator/server/**'

      - name: Initialize Unified Package Manager and Node Runtime
        uses: pnpm/setup@bf5bfae7d43e2b2b1191383f5005cd3fb69b848d # v4.0.0
        with:
          version: ${{ env.PNPM_TARGET_VERSION }}
          runtime: ${{ env.NODE_TARGET_VERSION }}
          install: false

      - name: Authorize Scoped Compiler Core Binaries
        run: pnpm approve-builds esbuild

      - name: Mount Turborepo Artifact Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Mount Cache-Optimized Supply Chain (Verify Dependencies)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install System Chromium Binary
        uses: browser-actions/setup-chrome@53b433108beecbba288c0531baeca36f43780a88
        with:
          chrome-version: stable

      - name: Compile Workspace Packages
        run: pnpm build

      - name: Execute Workspace Unit Tests
        run: pnpm turbo run test:unit

      - name: Generate Consumer Contract Specs
        run: pnpm turbo run test:contract --cache=""

      - name: Verify Provider Contract Compliance
        run: pnpm turbo run test:verify

  generate-documentation:
    name: Generate SBOM and Architecture Reports
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Install Skaffold
        env:
          SKAFFOLD_VERSION: ${{ env.SKAFFOLD_VERSION }}
        run: |
          skaffold_binary=skaffold-linux-amd64
          skaffold_url="https://storage.googleapis.com/skaffold/releases/${SKAFFOLD_VERSION}"
          curl -fsSLo "$RUNNER_TEMP/$skaffold_binary" "$skaffold_url/$skaffold_binary"
          curl -fsSLo "$RUNNER_TEMP/$skaffold_binary.sha256" "$skaffold_url/$skaffold_binary.sha256"
          (cd "$RUNNER_TEMP" && sha256sum --check "$skaffold_binary.sha256")
          sudo install "$RUNNER_TEMP/$skaffold_binary" /usr/local/bin/skaffold
          skaffold version

      - name: Install Trivy
        env:
          TRIVY_VERSION: ${{ env.TRIVY_VERSION }}
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          base_url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -fsSLo "$RUNNER_TEMP/$archive" "$base_url/$archive"
          curl -fsSLo "$RUNNER_TEMP/trivy_checksums.txt" \
            "$base_url/trivy_${TRIVY_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep "  ${archive}$" trivy_checksums.txt | sha256sum --check -)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" trivy
          sudo install "$RUNNER_TEMP/trivy" /usr/local/bin/trivy
          trivy --version

      - name: Checkout CycloneDX Sunshine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          repository: CycloneDX/Sunshine
          ref: ${{ env.SUNSHINE_REVISION }}
          path: .tools/cyclonedx-sunshine

      - name: Set Up Python and Sunshine Dependency
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test Report Generation Logic
        run: python -m unittest discover -s scripts/tests -v

      - name: Install Pinned Sunshine Dependency
        run: python -m pip install --disable-pip-version-check --only-binary :all: requests==2.32.5

      - name: Build Images and Generate Reports
        env:
          SUNSHINE_CLI: .tools/cyclonedx-sunshine/sunshine.py
          SUNSHINE_REVISION: ${{ env.SUNSHINE_REVISION }}
        run: sh scripts/generate_doc_reports.sh

      - name: Upload Generated Reports
        uses: actions/upload-artifact@v4
        with:
          name: sbom-and-architecture-reports
          path: docs/generated/
          if-no-files-found: error

  publish-generated-documentation:
    name: Open Generated Reports Pull Request
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [verify-and-test, generate-documentation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          ref: master

      - name: Download Generated Reports
        uses: actions/download-artifact@v4
        with:
          name: sbom-and-architecture-reports
          path: ${{ runner.temp }}/generated-reports

      - name: Synchronize Changed Reports
        run: |
          python3 scripts/sync_generated_reports.py \
            --source "$RUNNER_TEMP/generated-reports" \
            --destination docs/generated

      - name: Create or Update Reports Pull Request
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPORT_BRANCH: automation/generated-documentation
        run: |
          if [ "$(git rev-parse HEAD)" != "$SOURCE_COMMIT" ]; then
            echo "master advanced while reports were generated; refusing to publish stale outputs." >&2
            exit 1
          fi
          git add docs/generated/
          if git diff --cached --quiet -- docs/generated/; then
            echo "Generated reports are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh generated SBOM and architecture reports [skip ci]"
          git push --force origin "HEAD:refs/heads/$REPORT_BRANCH"
          existing_pr=$(gh pr list \
            --base master \
            --head "$GITHUB_REPOSITORY_OWNER:$REPORT_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -z "$existing_pr" ]; then
            gh pr create \
              --base master \
              --head "$REPORT_BRANCH" \
              --title "docs: refresh generated SBOM and architecture reports" \
              --body "Automated update of generated SBOM and architecture documentation. The report-generation and verification jobs passed for the source commit."
          else
            echo "Updated generated documentation pull request #$existing_pr."
          fi
          gh workflow run ci.yaml --ref "$REPORT_BRANCH"
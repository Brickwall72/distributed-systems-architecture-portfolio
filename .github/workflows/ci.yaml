# File: .github/workflows/ci.yaml
name: Continuous Integration Quality Gate

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      registry_diagnostics_only:
        description: Check GHCR authorization only (no builds, tests, or publishing)
        type: boolean
        default: false

env:
  NODE_TARGET_VERSION: 'node@26.7.0'
  PNPM_TARGET_VERSION: '11.24.0'
  SKAFFOLD_VERSION: 'v2.25.0'
  TRIVY_VERSION: '0.76.1'
  SUNSHINE_REVISION: 'beaab3faf2bab234069a8677fc627de2f0f01a3d'

permissions:
  contents: read

jobs:
  demo-ui-changes:
    name: Select relevant CI checks
    if: ${{ !inputs.registry_diagnostics_only }}
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.select.outputs.images }}
      smoke: ${{ steps.select.outputs.smoke }}
      workspace: ${{ steps.select.outputs.workspace }}
      node: ${{ steps.select.outputs.node }}
      ui_integration: ${{ steps.select.outputs.ui_integration }}
      service_integration: ${{ steps.select.outputs.service_integration }}
      contracts: ${{ steps.select.outputs.contracts }}
      automation: ${{ steps.select.outputs.automation }}
      base: ${{ steps.select.outputs.base }}
      full_workspace: ${{ steps.select.outputs.full_workspace }}
    steps:
      - name: Checkout comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0

      - name: Select changed images and smoke inputs
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          target=$(git rev-parse HEAD)
          initial=()
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base=$(git merge-base "$PR_BASE" "$target")
            smoke_base="$base"
          elif [[ "$EVENT_NAME" == push ]]; then
            smoke_base="$BEFORE"
            if [[ "$BEFORE" == 0000000000000000000000000000000000000000 ]]; then
              smoke_base="$target"
              initial=(--initial-publication)
            fi
            if git ls-remote --exit-code origin refs/heads/demo-ui-published > /dev/null; then
              git fetch --no-tags origin refs/heads/demo-ui-published
              base=$(git show FETCH_HEAD:demo-ui-images.json | python3 -c 'import json, sys; print(json.load(sys.stdin)["source"])')
              git merge-base --is-ancestor "$base" "$target"
            else
              status=$?
              if [[ "$status" != 2 ]]; then
                echo "Unable to read publication branch." >&2
                exit "$status"
              fi
              base="$target"
              initial=(--initial-publication)
            fi
          else
            echo "images=false" >> "$GITHUB_OUTPUT"
            echo "smoke=true" >> "$GITHUB_OUTPUT"
            for check in node workspace ui_integration service_integration contracts automation; do
              echo "$check=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          python3 scripts/select-demo-ui-images.py "$base" "$target" \
            --smoke-base "$smoke_base" --github-output "$GITHUB_OUTPUT" "${initial[@]}"

  verify-and-test:
    name: Execute Workspace Verification and Test Pipeline
    needs: [demo-ui-changes]
    if: ${{ !inputs.registry_diagnostics_only }}
    env:
      TURBO_SCM_BASE: ${{ needs.demo-ui-changes.outputs.base }}
      TURBO_SCM_HEAD: ${{ github.sha }}
      FULL_VERIFICATION: ${{ github.event_name == 'workflow_dispatch' || needs.demo-ui-changes.outputs.full_workspace == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # REQUIRED by paths-filter for PR evaluation

    steps:
      - name: Harden Runner Security Boundaries (Checkout Repository)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0 # Full git history allows Turbo and Pact to evaluate change boundaries reliably

      - name: Initialize Unified Package Manager and Node Runtime
        if: needs.demo-ui-changes.outputs.node == 'true'
        uses: pnpm/setup@bf5bfae7d43e2b2b1191383f5005cd3fb69b848d # v4.0.0
        with:
          version: ${{ env.PNPM_TARGET_VERSION }}
          runtime: ${{ env.NODE_TARGET_VERSION }}
          install: false

      - name: Authorize Scoped Compiler Core Binaries
        if: needs.demo-ui-changes.outputs.workspace == 'true'
        run: pnpm approve-builds esbuild

      - name: Mount Turborepo Artifact Cache
        if: needs.demo-ui-changes.outputs.workspace == 'true'
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Mount Cache-Optimized Supply Chain (Verify Dependencies)
        if: needs.demo-ui-changes.outputs.workspace == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install System Chromium Binary
        if: needs.demo-ui-changes.outputs.contracts == 'true'
        uses: browser-actions/setup-chrome@53b433108beecbba288c0531baeca36f43780a88
        with:
          chrome-version: stable

      - name: Compile Affected Workspace Packages
        if: needs.demo-ui-changes.outputs.workspace == 'true'
        run: |
          scope=(--affected)
          if [[ "$FULL_VERIFICATION" == true ]]; then scope=(); fi
          pnpm turbo run build "${scope[@]}"

      - name: Execute Affected Workspace Unit Tests
        if: needs.demo-ui-changes.outputs.workspace == 'true'
        run: |
          scope=(--affected)
          if [[ "$FULL_VERIFICATION" == true ]]; then scope=(); fi
          pnpm turbo run test:unit "${scope[@]}"

      - name: Execute UI Integration Tests
        if: needs.demo-ui-changes.outputs.ui_integration == 'true'
        run: pnpm --filter compliance-shell test:integration

      - name: Execute Isolated Service Integration Tests
        if: needs.demo-ui-changes.outputs.service_integration == 'true'
        run: pnpm test:integration

      - name: Test Repository Automation Scripts
        if: needs.demo-ui-changes.outputs.automation == 'true'
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Generate Consumer Contract Specs
        if: needs.demo-ui-changes.outputs.contracts == 'true'
        run: pnpm turbo run test:contract --cache=""

      - name: Verify Provider Contract Compliance
        if: needs.demo-ui-changes.outputs.contracts == 'true'
        run: pnpm turbo run test:verify

      - name: Report selected checks
        env:
          CHECKS: ${{ toJSON(needs.demo-ui-changes.outputs) }}
        run: printf '%s\n' "$CHECKS"

  generate-documentation:
    name: Generate SBOM and Architecture Reports
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Install Skaffold
        env:
          SKAFFOLD_VERSION: ${{ env.SKAFFOLD_VERSION }}
        run: |
          skaffold_binary=skaffold-linux-amd64
          skaffold_url="https://storage.googleapis.com/skaffold/releases/${SKAFFOLD_VERSION}"
          curl -fsSLo "$RUNNER_TEMP/$skaffold_binary" "$skaffold_url/$skaffold_binary"
          curl -fsSLo "$RUNNER_TEMP/$skaffold_binary.sha256" "$skaffold_url/$skaffold_binary.sha256"
          (cd "$RUNNER_TEMP" && sha256sum --check "$skaffold_binary.sha256")
          sudo install "$RUNNER_TEMP/$skaffold_binary" /usr/local/bin/skaffold
          skaffold version

      - name: Install Trivy
        env:
          TRIVY_VERSION: ${{ env.TRIVY_VERSION }}
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          base_url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -fsSLo "$RUNNER_TEMP/$archive" "$base_url/$archive"
          curl -fsSLo "$RUNNER_TEMP/trivy_checksums.txt" \
            "$base_url/trivy_${TRIVY_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep "  ${archive}$" trivy_checksums.txt | sha256sum --check -)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" trivy
          sudo install "$RUNNER_TEMP/trivy" /usr/local/bin/trivy
          trivy --version

      - name: Checkout CycloneDX Sunshine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          repository: CycloneDX/Sunshine
          ref: ${{ env.SUNSHINE_REVISION }}
          path: .tools/cyclonedx-sunshine

      - name: Set Up Python and Sunshine Dependency
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test Report Generation Logic
        run: python -m unittest discover -s scripts/tests -v

      - name: Install Pinned Sunshine Dependency
        run: |
          python -m pip install --disable-pip-version-check \
            --only-binary=:all: requests==2.32.5

      - name: Build Images and Generate Reports
        env:
          SUNSHINE_CLI: .tools/cyclonedx-sunshine/sunshine.py
          SUNSHINE_REVISION: ${{ env.SUNSHINE_REVISION }}
        run: sh scripts/generate_doc_reports.sh

      - name: Upload Generated Reports
        uses: actions/upload-artifact@v4
        with:
          name: sbom-and-architecture-reports
          path: docs/generated/
          if-no-files-found: error

  demo-ui-browser-smoke:
    name: Test demo UI in disposable k3d
    needs: [demo-ui-changes]
    if: ${{ needs.demo-ui-changes.outputs.smoke == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.DEMO_UI_PUBLISH_ENABLED == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Set up Node and pnpm
        uses: pnpm/setup@bf5bfae7d43e2b2b1191383f5005cd3fb69b848d # v4.0.0
        with:
          version: ${{ env.PNPM_TARGET_VERSION }}
          runtime: ${{ env.NODE_TARGET_VERSION }}
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@facf10a55b9caf92e0cc749b4f82bf8220989148 # v1.7.2
        with:
          chrome-version: stable

      - name: Install pinned cluster and build tools
        run: |
          curl_proto='=https'
          mkdir -p "$RUNNER_TEMP/dsap-bin"
          curl --proto "$curl_proto" --proto-redir "$curl_proto" -fsSLo "$RUNNER_TEMP/dsap-bin/k3d" \
            https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
          echo "06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0  $RUNNER_TEMP/dsap-bin/k3d" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/dsap-bin/k3d"
          skaffold_url="https://storage.googleapis.com/skaffold/releases/${SKAFFOLD_VERSION}"
          curl --proto "$curl_proto" --proto-redir "$curl_proto" -fsSLo "$RUNNER_TEMP/dsap-bin/skaffold" "$skaffold_url/skaffold-linux-amd64"
          curl --proto "$curl_proto" --proto-redir "$curl_proto" -fsSLo "$RUNNER_TEMP/dsap-bin/skaffold.sha256" "$skaffold_url/skaffold-linux-amd64.sha256"
          (cd "$RUNNER_TEMP/dsap-bin" && sed 's/skaffold-linux-amd64$/skaffold/' skaffold.sha256 | sha256sum --check -)
          chmod +x "$RUNNER_TEMP/dsap-bin/skaffold"
          echo "$RUNNER_TEMP/dsap-bin" >> "$GITHUB_PATH"

      - name: Exercise transfer, signing, PDFs and topology
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: bash scripts/ci-demo-ui-browser-smoke.sh

  check-demo-ui-registry:
    name: Check GHCR authorization
    needs: [demo-ui-changes]
    if: ${{ !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.registry_diagnostics_only) || (needs.demo-ui-changes.result == 'success' && needs.demo-ui-changes.outputs.images == 'true' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.DEMO_UI_PUBLISH_ENABLED == 'true')))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout diagnostic script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Check each UI package without uploading images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish-demo-ui-images.py --registry "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" --check-registry-access

  publish-demo-ui:
    name: Publish demo UI images
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.DEMO_UI_PUBLISH_ENABLED == 'true' && needs.demo-ui-changes.outputs.images == 'true'
    needs: [demo-ui-changes, verify-and-test, demo-ui-browser-smoke, check-demo-ui-registry]
    runs-on: ubuntu-latest
    concurrency:
      group: demo-ui-publication
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish images and manifest
        run: bash scripts/publish-demo-ui-release.sh

  publish-generated-documentation:
    name: Open Generated Reports Pull Request
    if: ${{ false }}
    needs: [verify-and-test, generate-documentation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          ref: master

      - name: Download Generated Reports
        uses: actions/download-artifact@v4
        with:
          name: sbom-and-architecture-reports
          path: ${{ runner.temp }}/generated-reports

      - name: Synchronize Changed Reports
        run: |
          python3 scripts/sync_generated_reports.py \
            --source "$RUNNER_TEMP/generated-reports" \
            --destination docs/generated

      - name: Create or Update Reports Pull Request
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPORT_BRANCH: automation/generated-documentation
        run: |
          if [ "$(git rev-parse HEAD)" != "$SOURCE_COMMIT" ]; then
            echo "master advanced while reports were generated; refusing to publish stale outputs." >&2
            exit 1
          fi
          git add docs/generated/
          if git diff --cached --quiet -- docs/generated/; then
            echo "Generated reports are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh generated SBOM and architecture reports [skip ci]"
          git push --force origin "HEAD:refs/heads/$REPORT_BRANCH"
          existing_pr=$(gh pr list \
            --base master \
            --head "$GITHUB_REPOSITORY_OWNER:$REPORT_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -z "$existing_pr" ]; then
            gh pr create \
              --base master \
              --head "$REPORT_BRANCH" \
              --title "docs: refresh generated SBOM and architecture reports" \
              --body "Automated update of generated SBOM and architecture documentation. The report-generation and verification jobs passed for the source commit."
          else
            echo "Updated generated documentation pull request #$existing_pr."
          fi
          gh workflow run ci.yaml --ref "$REPORT_BRANCH"
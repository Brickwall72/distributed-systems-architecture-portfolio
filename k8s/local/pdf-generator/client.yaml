# File: k8s/local/pdf-generator/client.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-client
spec:
  selector:
    matchLabels:
      app: pdf-client
  template:
    metadata:
      labels:
        app: pdf-client
    spec:
      containers:
      - name: pdf-client
        image: pdf-client:local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4011
---
apiVersion: v1
kind: Service
metadata:
  name: pdf-client
spec:
  selector:
    app: pdf-client
  ports:
  - port: 4011
    targetPort: 4011
# File: k8s/local/pdf-generator/client.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-client
  namespace: platform-local
spec:
  selector:
    matchLabels:
      app: pdf-client
  template:
    metadata:
      labels:
        app: pdf-client
    spec:
      serviceAccountName: pdf-client
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: pdf-client
        image: pdf-client:local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4011
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 750m
            memory: 512Mi
            ephemeral-storage: 512Mi
        readinessProbe:
          tcpSocket:
            port: 4011
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 4011
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: pdf-client
  namespace: platform-local
spec:
  selector:
    app: pdf-client
  ports:
  - port: 4011
    targetPort: 4011
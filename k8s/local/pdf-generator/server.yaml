# File: k8s/local/pdf-generator/server.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-server
spec:
  selector:
    matchLabels:
      app: pdf-server
  template:
    metadata:
      labels:
        app: pdf-server
    spec:
      containers:
      - name: pdf-server
        image: pdf-server:local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4001
---
apiVersion: v1
kind: Service
metadata:
  name: pdf-server
spec:
  selector:
    app: pdf-server
  ports:
  - port: 4001
    targetPort: 4001
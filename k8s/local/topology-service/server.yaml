# File: k8s/local/topology-service/server.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: topology-server
  namespace: platform-local
spec:
  selector:
    matchLabels:
      app: topology-server
  template:
    metadata:
      labels:
        app: topology-server
    spec:
      serviceAccountName: topology-server
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: topology-server
        image: topology-server:local
        imagePullPolicy: IfNotPresent
        env:
        - name: SERVER_PORT
          value: "8082"
        - name: DB_URI
          value: "bolt://topology-db:7687"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: topology-db-credentials
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: topology-db-credentials
              key: DB_PASSWORD
        - name: DB_CONNECT_RETRIES
          value: "30"
        - name: DB_CONNECT_RETRY_DELAY_MS
          value: "3000"
        ports:
        - containerPort: 8082
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 512Mi
        readinessProbe:
          httpGet:
            path: /api/v1/topology/health
            port: 8082
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /api/v1/topology/health
            port: 8082
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /api/v1/topology/health
            port: 8082
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: topology-server
  namespace: platform-local
spec:
  selector:
    app: topology-server
  ports:
  - port: 8082
    targetPort: 8082
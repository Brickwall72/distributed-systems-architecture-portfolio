# File: k8s/local/topology-service/db.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: topology-db
spec:
  selector:
    matchLabels:
      app: topology-db
  template:
    metadata:
      labels:
        app: topology-db
    spec:
      containers:
      - name: neo4j
        image: neo4j:5.26.0
        imagePullPolicy: IfNotPresent
        env:
        - name: NEO4J_AUTH
          value: "neo4j/SecureAviationToken71"
        ports:
        - containerPort: 7687
        - containerPort: 7474
---
apiVersion: v1
kind: Service
metadata:
  name: topology-db
spec:
  selector:
    app: topology-db
  ports:
  - name: bolt
    port: 7687
    targetPort: 7687
  - name: http
    port: 7474
    targetPort: 7474
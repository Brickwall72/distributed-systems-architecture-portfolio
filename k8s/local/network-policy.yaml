# File: k8s/local/network-policy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: platform-local
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: platform-local
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-ingress
  namespace: platform-local
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
    ports:
    - protocol: TCP
      port: 3000
    - protocol: TCP
      port: 3010
    - protocol: TCP
      port: 3011
    - protocol: TCP
      port: 3020
    - protocol: TCP
      port: 3021
    - protocol: TCP
      port: 4001
    - protocol: TCP
      port: 4011
    - protocol: TCP
      port: 4002
    - protocol: TCP
      port: 4012
    - protocol: TCP
      port: 8083
    - protocol: TCP
      port: 8082
    - protocol: TCP
      port: 9001
    - protocol: TCP
      port: 3040
---

# File: k8s/local/esign-service/server.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: esign-server
  namespace: platform-local
spec:
  selector:
    matchLabels:
      app: esign-server
  template:
    metadata:
      labels:
        app: esign-server
    spec:
      serviceAccountName: esign-server
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: esign-server
        image: esign-server:local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4002
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
            ephemeral-storage: 512Mi
          limits:
            cpu: 1
            memory: 1Gi
            ephemeral-storage: 2Gi
        readinessProbe:
          httpGet:
            path: /api/v1/esign/health
            port: 4002
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/v1/esign/health
            port: 4002
          initialDelaySeconds: 20
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: esign-server
  namespace: platform-local
spec:
  selector:
    app: esign-server
  ports:
  - port: 4002
    targetPort: 4002
# File: k8s/local/shells/global.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: global-shell
  namespace: platform-local
spec:
  selector:
    matchLabels:
      app: global-shell
  template:
    metadata:
      labels:
        app: global-shell
    spec:
      serviceAccountName: global-shell
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: global-shell
        image: global-shell:local
        imagePullPolicy: IfNotPresent
        env:
        - name: TOPOLOGY_REMOTE_ENTRY
          value: "http://localhost:8081/topology/remoteEntry.js"
        - name: COMPLIANCE_REMOTE_ENTRY
          value: "http://localhost:8081/compliance/remoteEntry.js"
        - name: TOPOLOGY_API_URL
          value: "http://localhost:8081/api/v1/topology"
        - name: PDF_API_URL
          value: "http://localhost:8081/api/v1/pdf"
        ports:
        - containerPort: 3000
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 750m
            memory: 512Mi
            ephemeral-storage: 512Mi
        readinessProbe:
          tcpSocket:
            port: 3000
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: global-shell
  namespace: platform-local
spec:
  selector:
    app: global-shell
  ports:
  - port: 3000
    targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: global-shell-ingress
  namespace: platform-local
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: global-shell
            port:
              number: 3000
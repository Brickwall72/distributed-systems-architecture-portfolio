# File: k8s/local/shells/compliance.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-shell
spec:
  selector:
    matchLabels:
      app: compliance-shell
  template:
    metadata:
      labels:
        app: compliance-shell
    spec:
      containers:
      - name: compliance-shell
        image: compliance-shell:local
        imagePullPolicy: IfNotPresent
        env:
        - name: COMPLIANCE_REMOTE_ENTRY
          value: "http://localhost:8080/compliance/client/remoteEntry.js"
        - name: TOPOLOGY_REMOTE_ENTRY
          value: "http://localhost:8080/topology/client/remoteEntry.js"
        - name: PDF_REMOTE_ENTRY
          value: "http://localhost:8080/pdf/client/remoteEntry.js"
        - name: TOPOLOGY_API_URL
          value: "http://localhost:8080/api/v1/topology"
        - name: PDF_API_URL
          value: "http://localhost:8080/api/v1/pdf"
        ports:
        - containerPort: 3020
---
apiVersion: v1
kind: Service
metadata:
  name: compliance-shell
spec:
  selector:
    app: compliance-shell
  ports:
  - port: 3020
    targetPort: 3020
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: compliance-shell-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - http:
      paths:
      - path: /compliance
        pathType: Prefix
        backend:
          service:
            name: compliance-shell
            port:
              number: 3020
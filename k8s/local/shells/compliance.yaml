# File: k8s/local/shells/compliance.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-shell
  namespace: platform-local
spec:
  selector:
    matchLabels:
      app: compliance-shell
  template:
    metadata:
      labels:
        app: compliance-shell
    spec:
      serviceAccountName: compliance-shell
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: compliance-shell
        image: compliance-shell:local
        imagePullPolicy: IfNotPresent
        env:
        - name: COMPLIANCE_REMOTE_ENTRY
          value: "http://localhost:8080/compliance/client/remoteEntry.js"
        - name: TOPOLOGY_REMOTE_ENTRY
          value: "http://localhost:8080/topology/client/remoteEntry.js"
        - name: PDF_REMOTE_ENTRY
          value: "http://localhost:8080/pdf/client/remoteEntry.js"
        - name: TOPOLOGY_API_URL
          value: "http://localhost:8080/api/v1/topology"
        - name: PDF_API_URL
          value: "http://localhost:8080/api/v1/pdf"
        ports:
        - containerPort: 3020
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 250m
            memory: 512Mi
            ephemeral-storage: 512Mi
        readinessProbe:
          tcpSocket:
            port: 3020
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 3020
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: compliance-shell
  namespace: platform-local
spec:
  selector:
    app: compliance-shell
  ports:
  - port: 3020
    targetPort: 3020
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: compliance-shell-ingress
  namespace: platform-local
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - http:
      paths:
      - path: /compliance
        pathType: Prefix
        backend:
          service:
            name: compliance-shell
            port:
              number: 3020
# File: k8s/local/shells/topology.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: topology-shell
  namespace: platform-local
spec:
  selector:
    matchLabels:
      app: topology-shell
  template:
    metadata:
      labels:
        app: topology-shell
    spec:
      serviceAccountName: topology-shell
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: topology-shell
        image: topology-shell:local
        imagePullPolicy: IfNotPresent
        env:
        - name: TOPOLOGY_REMOTE_ENTRY
          value: "http://localhost:8080/topology/client/remoteEntry.js"
        ports:
        - containerPort: 3010
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 250m
            memory: 512Mi
            ephemeral-storage: 512Mi
        readinessProbe:
          tcpSocket:
            port: 3010
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 3010
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: topology-shell
  namespace: platform-local
spec:
  selector:
    app: topology-shell
  ports:
  - port: 3010
    targetPort: 3010
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: topology-shell-ingress
  namespace: platform-local
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - http:
      paths:
      - path: /topology
        pathType: Prefix
        backend:
          service:
            name: topology-shell
            port:
              number: 3010
# File: k8s/local/shells/topology.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: topology-shell
spec:
  selector:
    matchLabels:
      app: topology-shell
  template:
    metadata:
      labels:
        app: topology-shell
    spec:
      containers:
      - name: topology-shell
        image: topology-shell:local
        imagePullPolicy: IfNotPresent
        env:
        - name: TOPOLOGY_REMOTE_ENTRY
          value: "http://localhost:8080/topology/client/remoteEntry.js"
        ports:
        - containerPort: 3010
---
apiVersion: v1
kind: Service
metadata:
  name: topology-shell
spec:
  selector:
    app: topology-shell
  ports:
  - port: 3010
    targetPort: 3010
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: topology-shell-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - http:
      paths:
      - path: /topology
        pathType: Prefix
        backend:
          service:
            name: topology-shell
            port:
              number: 3010
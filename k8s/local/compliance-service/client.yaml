# File: k8s/local/compliance-service/client.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-client
  namespace: platform-local
  labels:
    app: compliance-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: compliance-client
  template:
    metadata:
      labels:
        app: compliance-client
    spec:
      serviceAccountName: compliance-client
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: compliance-client
          image: compliance-client:local
          ports:
            - containerPort: 3021
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 512Mi
          readinessProbe:
            tcpSocket:
              port: 3021
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3021
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: compliance-client
  namespace: platform-local
spec:
  type: ClusterIP
  selector:
    app: compliance-client
  ports:
    - port: 3021
      targetPort: 3021
      protocol: TCP
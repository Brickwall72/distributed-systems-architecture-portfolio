# File: k8s/local/compliance-service/client.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-client
  namespace: default
  labels:
    app: compliance-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: compliance-client
  template:
    metadata:
      labels:
        app: compliance-client
    spec:
      containers:
        - name: compliance-client
          image: compliance-client:local
          ports:
            - containerPort: 3021
          imagePullPolicy: IfNotPresent
---
apiVersion: v1
kind: Service
metadata:
  name: compliance-client
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: compliance-client
  ports:
    - port: 3021
      targetPort: 3021
      protocol: TCP
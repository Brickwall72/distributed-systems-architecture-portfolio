apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: compliance-ingress
  namespace: default
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      # - path: /api/v1/compliance
      #   pathType: Prefix
      #   backend:
      #     service:
      #       name: compliance-server
      #       port:
      #         number: 8082
      - path: /compliance/client
        pathType: Prefix
        backend:
          service:
            name: compliance-client
            port:
              number: 3021
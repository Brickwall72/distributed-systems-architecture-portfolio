# File: k8s/local/compliance-service/db.yaml
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: compliance-db-pvc
  namespace: platform-local
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-db
  namespace: platform-local
spec:
  selector:
    matchLabels:
      app: compliance-db
  template:
    metadata:
      labels:
        app: compliance-db
    spec:
      serviceAccountName: compliance-db
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:18.6-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: compliance-db-credentials
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: compliance-db-credentials
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: compliance-db-credentials
              key: POSTGRES_DB
        # Moved out of secrets, set to standard Postgres data path
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        # Mount the storage volume
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
            ephemeral-storage: 256Mi
          limits:
            cpu: 1
            memory: 1Gi
            ephemeral-storage: 1Gi
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 5
        livenessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 30
          periodSeconds: 20
      # Define the volume linked to the PVC
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: compliance-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: compliance-db
  namespace: platform-local
spec:
  selector:
    app: compliance-db
  ports:
  - name: tcp-postgres
    port: 5432
    targetPort: 5432
# File: k8s/local/compliance-service/server.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-server
  namespace: platform-local
spec:
  selector:
    matchLabels:
      app: compliance-server
  template:
    metadata:
      labels:
        app: compliance-server
    spec:
      serviceAccountName: compliance-server
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: wait-for-compliance-db
        image: postgres:18.6-alpine
        imagePullPolicy: IfNotPresent
        command: ['sh', '-c', 'until pg_isready -h compliance-db -p 5432 -U postgres; do echo waiting for database...; sleep 2; done']
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
            ephemeral-storage: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
            ephemeral-storage: 128Mi
      containers:
      - name: compliance-server
        image: compliance-server:prod
        imagePullPolicy: IfNotPresent
        env:
        - name: SERVER_PORT
          value: "8082"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: compliance-db-credentials
              key: DATABASE_URL
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: compliance-db-credentials
              key: DB_USER
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: compliance-db-credentials
              key: DB_USER
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: compliance-db-credentials
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: compliance-db-credentials
              key: DB_PASSWORD
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: compliance-db-credentials
              key: DB_PASSWORD
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: compliance-db-credentials
              key: DB_PASSWORD
        - name: DB_HOST
          value: "compliance-db"
        - name: PGHOST
          value: "compliance-db"
        - name: DB_PORT
          value: "5432"
        - name: PGPORT
          value: "5432"
        - name: DB_NAME
          value: "compliance"
        - name: PGDATABASE
          value: "compliance"
        ports:
        - containerPort: 8082
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 512Mi
        readinessProbe:
          httpGet:
            path: /api/v1/compliance/health
            port: 8082
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /api/v1/compliance/health
            port: 8082
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /api/v1/compliance/health
            port: 8082
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: compliance-server
  namespace: platform-local
spec:
  selector:
    app: compliance-server
  ports:
  - port: 8082
    targetPort: 8082